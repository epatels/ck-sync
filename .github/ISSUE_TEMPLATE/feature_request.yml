name: Suggest an idea
description: Something CK Sync could do, or do better.
title: "[Idea] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: This page is public. Please do not include personal information.
  - type: textarea
    id: need
    attributes:
      label: What are you trying to do?
      description: Describe the situation, not only the feature. It helps to know why.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like CK Sync to do?
    validations:
      required: true
  - type: textarea
    id: now
    attributes:
      label: How do you do it today? (optional)
